name: ci

on:
  pull_request: {}
  push:
    branches: [main]

jobs:
  whw:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    name: whw (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Tests
        run: npm test
      - name: Sync planning
        run: node ./bin/whw.js sync --all
      - name: Doctor
        run: node ./bin/whw.js doctor
      - name: PR gates
        run: node ./bin/whw.js gate run --tier pr

  ci:
    name: ci
    if: always()
    needs: whw
    runs-on: ubuntu-latest
    steps:
      - name: All matrix cells green
        run: test "${{ needs.whw.result }}" = "success"
