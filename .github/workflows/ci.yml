name: ci

on:
  pull_request: {}
  push:
    branches: [main]

jobs:
  whw:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    name: whw (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Tests
        run: npm test
      - name: Sync planning
        run: node ./bin/whw.js sync --all
      - name: Doctor
        run: node ./bin/whw.js doctor
      - name: PR gates
        run: node ./bin/whw.js gate run --tier pr

  composer-offline:
    name: composer-offline (fixture)
    needs: whw
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Composer analysis against recorded fixture (no API key)
        run: node --test tests/benchmark/composer-analysis.test.js tests/unit/composer-auth.test.js

  ci:
    name: ci
    if: always()
    needs: [whw, composer-offline]
    runs-on: ubuntu-latest
    steps:
      - name: All matrix cells green
        run: test "${{ needs.whw.result }}" = "success"
      - name: Composer offline check green
        run: test "${{ needs.composer-offline.result }}" = "success"
