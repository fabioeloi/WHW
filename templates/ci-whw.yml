name: whw

on:
  pull_request: {}
  push:
    branches: [main]

jobs:
  whw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Doctor
        run: npx -y @fabioeloi/whw@latest doctor
      - name: PR gates
        run: npx -y @fabioeloi/whw@latest gate run --tier pr
